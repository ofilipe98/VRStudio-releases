releaseNotes: |
  **v0.6.19-beta.8** · 10 mudanças de 1 colaborador

  - Auditoria DB Monitor: com a aprovação de host, o agente navega diretórios, procura arquivos por nome, resolve links, lê arquivos inteiros em blocos e percorre o journal por intervalo, tudo somente leitura pelo VRMonitor.
  - As leituras do host viram coletas que continuam entre turnos e depois de reabrir o Studio, com a evidência salva na pasta da conversa e sem bytes duplicados.
  - Se o Monitor ainda não tiver a nova rota de arquivos, a auditoria avisa que ele precisa ser atualizado, sem alternativa por shell.
  - Barra lateral: os cartões de conversa e o filtro de projetos voltam a seguir o T3 Code.

  ### Mais 2 correções e melhorias de desempenho.

  <details>
  <summary>Registro completo</summary>

  * fix(audit): break the host files import cycle and keep brand literals central
  * docs(audit): native host files and journal through the Monitor
  * feat(audit): read host files by block and by seek
  * feat(audit): implement host directory list, file find and journal executor
  * test(audit): host file tools keep native and MCP parity and isolation
  * feat(audit): host files executor plumbing, open and resolve
  * feat(audit): add native Monitor files transport and contract
  * feat(audit): define host file tool specs, presentation, and audit guide
  * feat(audit): persist host collection state and local artifacts
  * fix(sidebar): conversation cards and project filter follow t3 again

