releaseNotes: |
  **v0.6.16** · 56 mudanças de 1 colaborador

  - **Keystone Studio.** Pastas de dados, instalação, atalhos e notificações passam a usar o nome Keystone, com migração automática dos dados existentes, remoção da instalação antiga e atalhos fixados na barra de tarefas reapontados para o novo executável.
  - **Importação de pacotes descompilados.** Importações portáteis ficam utilizáveis e recuperáveis, mais rápidas e sem travar a interface, com progresso real em 4 etapas (extração, análise e indexação, publicação e catálogo).
  - **Abertura com tudo pronto.** A tela de carregamento só libera o Studio quando os índices de código e as conversas estão pré-carregados, o Studio não fica mais aberto depois de fechado e clicar no ícone da barra de tarefas minimiza e restaura a janela.
  - **Mais rápido no dia a dia.** Sugestões de ortografia instantâneas, Configurações e lista de conversas várias vezes mais rápidas, cliente web mais leve e todas as cotas do Antigravity na aba Limites.

  ### Mais 48 correções e melhorias de desempenho.

