releaseNotes: |
  **v0.6.20-beta.4** · 4 mudanças de 1 colaborador

  - **Abertura mais rápida.** O Studio libera o chat assim que as 20 conversas mais recentes estão prontas, em vez de esperar todo o histórico; as demais continuam carregando em segundo plano, sem travar a interface.
  - **Inicialização gráfica.** A verificação da placa de vídeo é reaproveitada entre aberturas enquanto drivers e versão não mudam, e componentes usados só pela Auditoria DB carregam quando são necessários.
  - **Conversas.** Voltar a uma conversa já aberta mantém a visão dela, sem reconstruir a timeline.
  - **Aviso de atualização.** O cartão "Nova versão disponível" fica inteiro dentro da janela, sem passar da borda inferior.

  ### Mais 3 correções e melhorias de desempenho.

  <details>
  <summary>Registro completo</summary>

  * fix(timeline): never rebuild the live document of a conversation already shown
  * test: wait for conditions instead of durations in three load-sensitive tests
  * perf(startup): open the chat after the recent conversations, cache the GPU probe
  * fix(updates): keep the update popup inside the window after it slides in

  </details>
