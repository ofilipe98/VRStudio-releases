releaseNotes: |
  **v0.6.15-beta.5** · 7 mudanças de 1 colaborador

  - **Um único Studio por vez.** Fechar o app durante uma tarefa longa não abre mais um segundo Studio sobre o banco travado; uma nova abertura avisa e inicia sozinha quando o anterior termina.
  - **Remoção de pacote segura ao fechar.** Fechar o Studio no meio da remoção de um pacote descompilado cancela a operação, preserva os arquivos e libera o banco.
  - **Ícone novo nos atalhos.** A atualização troca o ícone antigo dos atalhos do Menu Iniciar e da área de trabalho pelo da Keystone.

  ### Mais 6 correções e melhorias de desempenho.

  <details>
  <summary>Registro completo</summary>

  * fix(code): name the product from the brand profile in the removal message
  * fix(ui): never join arbitrary threads before releasing the instance
  * fix(ui): read the complete activation reply before deciding
  * fix(ui): hold the single-instance lock until the process exits
  * fix(code): cancel package deletion when the Studio closes
  * test: keep app.main() from leaking the process environment
  * fix(installer): refresh shortcut icons after rebranding

  </details>
