releaseNotes: |
  **v0.6.20-beta.6** · 2 mudanças de 1 colaborador

  - Barra lateral alinhada ao T3.** Os cartões de conversa medem 240 × 60 px na largura padrão de 256 px.
  - Seletor de modelos.** O menu ganha fundo translúcido com desfoque e divisórias mais finas. “Mostrar mais” revela os modelos antigos na mesma lista e funciona pelo teclado.
  - Detalhes da conversa e rodapé.** O cartão de detalhes segue o visual do seletor, e os botões do rodapé mantêm a cor correta ao passar o mouse ou pressionar.
  - Histórico do chat.** Trocar de conversa preserva o documento já renderizado quando chega um pré-carregamento atrasado.

  ### Mais 2 correções e melhorias de desempenho.

