releaseNotes: |
  **v0.6.19-beta.6** · 9 mudanças de 1 colaborador

  - Temas com os orbs do T3 Code em Aparência: cada tema mostra as variantes clara e escura com as cores de destaque e de ação.
  - Codex: "Enviar agora" volta a funcionar depois de reabrir o Studio, e o primeiro turno de uma conversa retomada não fica mais preso em execução.
  - OpenCode: "Aprovar nesta sessão" passa a valer de fato, e a Auditoria DB respeita a opção restritiva agent=plan.
  - Agendamentos: o agente vê se pode criar tarefas e indica onde ligar "Tarefas do agente" quando a opção está desligada.

  ### Mais 7 correções e melhorias de desempenho.

  <details>
  <summary>Registro completo</summary>

  * feat(ui): theme previews are T3 Code orbs
  * fix(opencode): audit refusal reasons take the product name from core.brand
  * fix: agents see the real schedule permission; OpenCode audit refusals name the cause
  * fix(opencode): session approvals take effect; agent=plan restricts audits
  * fix(updates): keep the product name out of the helper template comment
  * fix(codex): a resumed thread's token usage no longer hijacks the new turn
  * fix(updates): reopen the Studio when the old process outlives the helper wait
  * docs: keep validation files inside .test-tmp; decompilation extraction plan
  * fix: whole-codebase bug audit (desktop, web, providers, orchestrator, storage)

  </details>
