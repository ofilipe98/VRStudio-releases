releaseNotes: |
  **v0.6.17-beta.4** · 17 mudanças de 1 colaborador

  - Chat com leitura mais calma: coluna de 680px alinhada ao composer, títulos e listas mais claros, tabelas que se ajustam ao conteúdo e blocos de código mais discretos.
  - Composer único em repouso e expandido, com o seletor Agente VR, anexar e enviar na mesma linha.
  - Tema escuro em tom grafite e card de contexto, barras de rolagem e botões da barra de título mais discretos.
  - Correção: o Studio não fecha mais com erro depois de copiar um trecho do chat (o texto copiado é preservado).

  ### Mais 3 correções e melhorias de desempenho.

