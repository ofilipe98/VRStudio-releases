releaseNotes: |
  **v0.6.20-beta.5** · 4 mudanças de 1 colaborador

  - **Composer como o do T3.** Modelo e esforço num só botão ("GPT-6.1-Sol Alto"), anexar à esquerda, permissões só quando diferem do padrão, e o seletor de modelo reúne a coluna de esforço, a velocidade e as permissões. Esforço e permissões continuam ajustáveis durante a resposta.
  - **Subagentes.** Abrir um subagente não cria mais uma conversa na barra lateral; a conversa do subagente mostra "Subagente de" no topo e o agente pai nos detalhes, para voltar com um clique. O aviso de tarefa concluída já traz o resultado.
  - **Configurações e menus.** O esforço padrão usa o mesmo seletor do composer, ao lado do modelo, e os menus "⋯" seguem o visual do T3, sem espaços vazios.
  - **Sem janela de console.** A verificação de versão dos provedores (npm) não abre mais uma janela de CMD.

  ### Mais 1 correção e melhoria de desempenho.

  <details>
  <summary>Registro completo</summary>

  * feat(subagents): t3 navigation, parent links and inline completion results
  * feat(usage): spin the refresh icon while limits or history load
  * feat(composer): match the t3 composer, settings pickers and menus
  * fix(audit): recover journal logs and support routine catalogs

  </details>
