releaseNotes: |
  **v0.6.20-beta.3** · 13 mudanças de 1 colaborador

  - **Estabilidade.** Corrige o fechamento inesperado do Studio (falha em python312.dll) durante travamentos da interface; uma falha nativa agora deixa as pilhas em logs/native-crash.log.
  - **Desempenho.** A árvore de agentes, o inventário do índice de código e a lista de ferramentas da conversa deixam de travar a interface em bases grandes e turnos longos.
  - **Retomada.** O trabalho pendente após reiniciar aparece só dentro de cada conversa (aviso Retomar e fila segurada), sem cartão na barra lateral.
  - **Tarefas e citações.** Ciclo de vida das tarefas delegadas mais robusto e controles iguais no desktop e na web; o destaque de uma citação dura até a mensagem aparecer.

  ### Mais 10 correções e melhorias de desempenho.

  <details>
  <summary>Registro completo</summary>

  * test(audit): let the scope watcher see the simulated account switch
  * fix(timeline): time the citation highlight from the reveal, not the click
  * perf(timeline): reuse settled work entry views during tool-heavy turns
  * perf(code): keep the index inventory when a reader opens processing.sqlite
  * perf(agent-tree): probe agent cards by index instead of scanning all events
  * fix(telemetry): stop walking other threads' frames in the ui_stall sampler
  * fix(sidebar): keep the mode badge in place when hovering a card
  * test(timeline): give the fresh-process Chromium scenario a 360 s guard
  * fix(ui): drop the startup pending-work card from the sidebar
  * fix(orchestration): harden task lifecycle and align desktop/web controls
  * fix(ui): refine archive actions, package lists and close controls
  * refactor: remove obsolete Ultra and decompilation test scaffolding
  * fix: prevent Qt owner-thread crashes and audit lease deadlocks

  </details>
