  <summary>Registro completo</summary>

  * test(ui): ajusta testes para aba Logs, deep_storage e animacao do seletor de modelo
  * fix(ui): restaura foco e cursor no composer após abertura e retorno ao chat
  * fix(ui): reduz travamentos na troca de threads/seleção, melhora telemetria e adiciona aba Logs

