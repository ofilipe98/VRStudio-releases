releaseNotes: |
  **v0.6.18** · 5 mudanças de 1 colaborador

  - **Atualização que não quebra por falta de espaço.** O Studio e o instalador conferem o espaço livre antes de mexer na versão instalada; sem espaço, a atualização é recusada e a versão atual continua funcionando.
  - **Menos disco com backups.** A atualização guarda só 2 backups dos bancos (o anterior e o novo) e poda os antigos antes de copiar.
  - **Auditoria DB mais resistente.** Um arquivo inexistente no código publicado ou uma mudança no catálogo do banco não derrubam mais a sessão da auditoria; o agente renova o status e continua.
  - **Buscas no código mais rápidas.** O guia da base orienta o agente a descer até o aplicativo e o pacote antes de pesquisar, em vez de varrer a release inteira.

  ### Mais 3 correções e melhorias de desempenho.

  <details>
  <summary>Registro completo</summary>

  * fix(audit): preserve sessions across schema and source misses
  * fix(updates): keep two update backups and prune before copying
  * fix(updates): refuse an update that does not fit on the disk
  * chore(release): start 0.6.18
  * feat(vr): keep text searches off the release root in the base guide

  </details>
