releaseNotes: |
  **v0.6.19-beta.5** · 28 mudanças de 1 colaborador

  - Interface mais confortável: espaçamento e alinhamento do chat, composer e configurações refinados, com cores de destaque, status e sintaxe preservadas.
  - Cartões de conversa com projeto e provedor, detalhes flutuantes e automações vinculadas; perguntas de texto livre podem ser respondidas pelo composer com Enter.
  - Títulos escritos por modelo após a primeira mensagem e ao gerar novamente, inclusive em auditorias. Modelo, esforço e instruções configuráveis em Geral; o automático usa o modelo mais utilizado no menor esforço disponível.
  - VR Code escuro com superfícies pretas; temas Bosque, Oceano, Brasa e Íris em português. O tema Padrão mantém as superfícies em carvão.

  ### Mais 5 correções e melhorias de desempenho.

