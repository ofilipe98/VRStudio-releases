releaseNotes: |
  **v0.6.21-beta.5** · 3 mudanças de 1 colaborador

  - **Desempenho na interface.** Troca de conversas, seleção de texto e clique direito no chat ficaram mais fluidos, sem travamentos por varreduras ou limpeza pós-atualização na thread principal.
  - **Foco e cursor no composer.** O campo de mensagem recupera o foco automaticamente ao sair da tela inicial, fechar configurações do projeto ou reabrir conversas adiadas.
  - **Configurações → Logs.** Nova aba dedicada aos logs e diagnóstico dentro de Configurações, pesquisável e acessível pela paleta de comandos.

  ### Mais 2 correções e melhorias de desempenho.

