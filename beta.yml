releaseNotes: |
  **v0.6.17-beta.3** · 20 mudanças de 1 colaborador

  - **Visual mais confortável.** O tema escuro trocou o preto puro por um carvão suave, com texto branco atenuado e texto secundário mais legível. No claro, cartões brancos sobre fundo cinza e seleção visível na lista de conversas.
  - **Chat mais limpo.** Composer mais compacto e estável ao expandir, atividade agrupada sob o resumo com um trilho, tabelas na largura da mensagem, blocos de código com a linguagem e cartões de duas linhas na lista de conversas.
  - **Configurações reorganizadas.** Títulos e descrições com hierarquia consistente, ações de cabeçalho num único estilo, o editor de Provedores cresce com o conteúdo sem rolagem interna, e Aplicativos separa Catálogo e Pacotes VR em seções alinhadas.
  - **Auditoria DB.** Os logs do PostgreSQL são recuperados pelo journal da máquina quando os arquivos de log não estão disponíveis, e um resultado truncado não é mais apresentado como completo.

  ### Mais 7 correções e melhorias de desempenho.

