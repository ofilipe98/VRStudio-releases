releaseNotes: |
  **v0.6.15-beta.3** · 46 mudanças de 1 colaborador

  - Abertura mais leve: o Studio volta a usar a GPU quando ela funciona e abre uma única janela por vez, como o T3 Code.
  - Seletor de modelos no padrão do T3: modelo separado do esforço, Gemini em uma linha por modelo e atalhos Ctrl+1–9.
  - Configurações → Provedores mostra a conta na hora e confere em segundo plano; atualizar um provider não pede mais confirmação.
  - Auditoria DB respeita o perfil escolhido, inclusive Acesso total; auditorias existentes começam em Supervisionado.

