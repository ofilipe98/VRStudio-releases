releaseNotes: |
  **v0.6.21-beta.4** · 9 mudanças de 1 colaborador

  - Novo pacote de diagnóstico na tela de Logs com o ciclo de vida completo dos turnos para facilitar investigações.
  - Anexos de texto grandes respeitam o limite do provider sem estourar o envio.
  - O menu de contexto do composer agora habilita Colar para imagens e arquivos da área de transferência.
  - Exclusão definitiva de conversas funciona mesmo com arquivos em caminhos acima de 260 caracteres no Windows.

  ### Mais 5 correções e melhorias de desempenho.

  <details>
  <summary>Registro completo</summary>

  * test(ui): aguarda selecao de Ctrl+A no Chromium antes de ler window.getSelection
  * test(ui): aguarda montagem virtualizada em vez de qWait fixo em test_message_collapse
  * fix(ui): remove binding loop no elide do seletor de modelo e reduz overhead da lista de mensagens
  * fix(ui): habilita Colar no menu de contexto para imagem e arquivos
  * fix: exclusão com caminhos longos e foco ao reordenar modelos
  * test: isola o manifesto do CLI Antigravity entre testes
  * fix(logs): nome do produto no resumo do diagnóstico vem de core.brand
  * feat(logs): ciclo de vida dos turnos e pacote de diagnóstico
  * fix(chat): anexos de texto grandes não estouram o limite do provider

  </details>
