releaseNotes: |
  **v0.6.15** · 99 mudanças de 1 colaborador

  - **Keystone Studio.** O app tem nome e logo novos e uma aba Sobre com versão, canal, renderização, pastas e diagnóstico para copiar.
  - **Claude e GPT no Antigravity.** A conta Google oferece Claude Opus, Claude Sonnet e GPT-OSS, e o seletor de modelos segue o padrão do T3, com o nível de raciocínio no chip de esforço.
  - **Abertura mais rápida e estável.** O Studio usa a GPU quando ela funciona, abre só uma vez por pasta de dados e mostra o texto nítido também na versão instalada.
  - **Remoção de pacote segura.** Fechar o Studio no meio da remoção de um pacote descompilado cancela a operação e preserva os dados.

