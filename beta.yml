releaseNotes: |
  **v0.6.16-beta.3** · 10 mudanças de 1 colaborador

  - **Abertura com tudo pronto.** A tela de carregamento só libera o Studio quando os índices de código e todas as conversas estão pré-carregados, com o progresso de cada etapa; abrir qualquer conversa fica instantâneo desde o início. O pré-carregamento também não para mais com a janela minimizada ou coberta.
  - **Importação de pacotes com progresso real.** A importação mostra 4 etapas (extração, análise e indexação, publicação e catálogo), com contador, ritmo e tempo restante próprios, e não fica mais parada em 100% enquanto a análise roda.
  - **Barra de tarefas.** Clicar no ícone do Studio na barra de tarefas minimiza e restaura a janela, e atalhos fixados que ainda apontavam para o executável antigo são reapontados para o novo com a logo Keystone.
  - **Limites e atualizações.** A aba Limites mostra todas as cotas do Antigravity (Gemini, Gemini Argon e Claude e GPT), e o botão Verificar atualizações mostra uma animação enquanto verifica.

  ### Mais 8 correções e melhorias de desempenho.

  <details>
  <summary>Registro completo</summary>

  * fix(installer): find the pin migration helper next to the script
  * fix(ui): break the custom model editor implicit width loop
  * fix(usage): show every Antigravity quota bucket in Limits
  * feat(ui): animate the settings update check feedback
  * fix(ui): show four honest import steps and always end the package task
  * fix(code): report the portable import analysis phase while it runs
  * fix(ui): restore taskbar minimize/restore and the window brand icon
  * fix(installer): retarget legacy taskbar pins after the executable rename
  * feat(ui): keep the startup screen until index and conversation caches are warm
  * fix(ui): keep preloading conversations while the window is hidden

  </details>
