releaseNotes: |
  **v0.6.20** · 105 mudanças de 1 colaborador

  - **Provedores e Antigravity.** Várias instâncias com logins Google isolados, geradores de texto, proteção contra versões quebradas e abertura de Provedores mais rápida.
  - **Interface alinhada ao T3.** Fonte Inter sem hinting, composer de vidro, fila e subagentes no padrão T3 e continuação automática de turnos após reinício.
  - **Cliente Web 1:1.** Nova interface web com timeline, barra lateral, composer, configurações e páginas globais no padrão do desktop.
  - **Desempenho e base VR.** Abertura mais rápida, timeline fluida em conversas longas, fim dos perfis especialistas e download direto de vídeos ou pastas.

  ### Mais 61 correções e melhorias de desempenho.

