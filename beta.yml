releaseNotes: |
  **v0.6.16-beta.2** · 29 mudanças de 1 colaborador

  - **Pastas com o nome Keystone.** Os dados passam para %LOCALAPPDATA%\KeystoneStudio e o programa para Programs\keystonestudio. A primeira abertura move a pasta antiga sem copiar nada e mantém um atalho oculto no caminho antigo; se ela estiver em uso, o Studio continua nela e tenta de novo na próxima abertura. Atalhos fixados na barra de tarefas precisam ser fixados de novo.
  - **Importação de pacotes sem travar e índice completo.** O progresso não reconstrói mais o catálogo a cada atualização e o banco não espera a importação terminar. JARs idênticos em pastas diferentes não perdem mais fontes ao transferir um índice; uma migração repara bases já afetadas.
  - **Sugestões do corretor imediatas.** O clique direito numa palavra sublinhada mostra as sugestões em cerca de 0,1 s, antes até 9 s.
  - **OpenCode, menu de texto e janela.** O OpenCode aparece no composer com os modelos da sua conta; o clique direito no markdown oferece Copiar e Selecionar tudo, e copiar mostra "Copiado!"; a janela maximizada volta maximizada depois de minimizar.

  ### Mais 24 correções e melhorias de desempenho.

  <details>
  <summary>Registro completo</summary>

  * test(providers): follow the OpenCode 2 catalog contract in the CLI probe
  * fix(code): keep the identity repair inside the storage layer
  * fix(ui): run release metadata reads on the startup-prepared pool
  * perf(ui): decouple physical inventory from the frequent status
  * perf(ui): read release metadata outside the UI thread
  * perf(ui): memoize the VR package projection per revision
  * perf(ui): consolidate the applications selection updates
  * perf(ui): notify applications progress without rebuilding catalog state
  * perf(code): reuse parsed sources of duplicate JARs during portable imports
  * fix(code): keep source identity in index transfers and repair collapsed rows
  * perf(code): stage portable import files before the writer transaction
  * perf(code): keep processing readers out of the schema writer lock
  * perf(code): index the per-file progress probe
  * perf(ui): make composer spelling suggestions immediate
  * fix(ui): lighten the focused row of the timeline edit menu
  * feat(ui): add the T3 text editing menu to the timeline
  * fix(storage): never hide legacy data or touch a coexisting old install
  * fix(storage): keep diagnostics out of the real preference store
  * fix(storage): clean empty legacy Qt cache roots
  * fix(updates): relaunch the new Studio after a legacy silent update
  * docs: document the Keystone storage migration
  * feat(installer): rename installation artifacts and remove legacy installs
  * feat(storage): migrate persistent identifiers to Keystone
  * fix(ui): restore a minimized maximized window without a size jump
  * fix(ui): keep the window maximized after restoring from minimize
  * fix(providers): keep OpenCode models in the composer catalog
  * fix(ui): confirm timeline copy actions with a check and tooltip
  * fix(ui): show the project monogram on archived folders
  * fix(ui): render the composer in the Markdown face

  </details>
