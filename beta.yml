releaseNotes: |
  **v0.6.20-beta.1** · 18 mudanças de 1 colaborador

  - Interface web: o cliente no navegador agora tem a mesma aparência do Studio — barra lateral, cabeçalho, conversa, composer e tela de nova conversa iguais ao desktop.
  - Configurações na web: as 13 categorias do desktop, no mesmo layout, incluindo Provedores, Aplicativos e Versões, Wiki e KB, Auditoria DB, Tarefas agendadas e Conexões com computadores remotos.
  - Uso e Logs abrem como páginas ao lado da barra lateral; o navegador de código segue a origem do aplicativo selecionada.
  - Correções na web: conexões recusadas pelo servidor no Windows, fontes de conhecimento que não carregavam em Wiki e KB e erro ao abrir a lista de versões de um aplicativo.

