releaseNotes: |
  **v0.6.20-beta.12** · 9 mudanças de 1 colaborador

  - **Fonte Inter na interface.** O Studio agora usa a fonte Inter como padrão no desktop, na timeline e no cliente web (como no T3 Code), com migração automática única do antigo padrão Segoe UI.
  - **Timeline fluida ao redimensionar.** Conversas longas não travam mais ao redimensionar a janela ou abrir/fechar painéis: mensagens fora da tela pausam a renderização preservando a rolagem e voltam a renderizar quando atualizadas.
  - **Zoom consistente na timeline.** Ctrl + roda sobre a conversa ou artefatos HTML inline agora ajusta o zoom da interface do Studio, preservando o zoom próprio apenas nas páginas do Browser.
  - **Visual e composer mais limpos.** Ícones de projeto .ico mais nítidos (sem ampliação de 16 px), remoção do tooltip redundante no seletor de modelo e aposentadoria dos antigos perfis especialistas.

  ### Mais 7 correções e melhorias de desempenho.

  <details>
  <summary>Registro completo</summary>

  * fix(timeline): artigo pulado com conteúdo novo renderiza de novo
  * docs(timeline): alturas lembradas são exatas até o rewrap
  * fix(ui): Inter como fonte da interface, como o t3
  * fix(timeline): mantém artigos pulados no início e fim do turno
  * fix(timeline): artigos longe da vista não travam o redimensionamento
  * fix(ui): aplica zoom do app com Ctrl+roda sobre a timeline
  * fix(ui): remove tooltip redundante do seletor de modelo
  * fix(ui): ícone de projeto .ico nítido em vez do quadro de 16 px ampliado
  * feat(vr): aposenta os perfis especialistas

  </details>
