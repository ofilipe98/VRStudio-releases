releaseNotes: |
  **v0.6.17** · 75 mudanças de 1 colaborador

  - **Código descompilado por pacote.** A descompilação saiu do Studio: o código vem do KeyStone JarDecomp como ZIP, importado mais rápido, com remoção de pacotes cancelável e confirmação antes de fechar durante uma importação.
  - **Auditoria DB mais completa.** MCPs de todos os provedores como no chat comum, logs do PostgreSQL recuperados pelo journal sem falsa completude e auditorias agrupadas pelo cliente na lista lateral.
  - **Chat mais fluido.** Interface revisada de ponta a ponta, timeline fluida durante ferramentas e Markdown, mensagens em andamento na fila por padrão e cópia de mensagens com imagens e anexos.
  - **Perfis especialistas novos.** Especialista, Implantação, Suporte e Treinamento reescritos em torno do trabalho da equipe; avisos que só confirmam sucesso deixaram de aparecer.

