releaseNotes: |
  **v0.6.19-beta.7** · 8 mudanças de 1 colaborador

  - Atualizações: passe o mouse no botão de atualização para ver as novidades de todas as versões puladas, com barra de rolagem como no T3; uma versão nova abre um aviso com os destaques e "Baixar atualização".
  - Fila de mensagens: uma falha ao iniciar não apaga mais a fila, "Enviar agora" funciona numa mensagem pausada e um limite de uso ativo segura a fila até renovar.
  - Composer: colagem grande vira um chip pasted-text.txt no cursor, imagens acima de 10 MB são comprimidas e a seta para cima não traz mais "Continue de onde parou.".
  - Agente: leitura de conversas no orçamento do T3 (sem respostas gigantes), thread_launch sem exigir Acesso total, browser que reaproveita a aba e não grava a aba que você controla.

  ### Mais 6 correções e melhorias de desempenho.

