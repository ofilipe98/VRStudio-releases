releaseNotes: |
  **v0.6.19** · 178 mudanças de 1 colaborador

  - **Computadores remotos.** Abra o Studio de outro computador pela Tailscale, pela rede local ou por SSH, em Configurações → Conexões, como nos Environments do T3 Code.
  - **Cliente web mais completo.** O navegador ganha anexos e colagem grande durante o turno, aprovações e fila, provedores, browser, arquivos, terminal e agentes, mais perto do desktop.
  - **Auditoria DB com arquivos do host.** Com a aprovação de host, o agente navega diretórios, lê arquivos e percorre o journal pelo VRMonitor, somente leitura.
  - **Títulos por modelo e interface polida.** As conversas ganham títulos escritos por um modelo. O chat, o composer e os temas foram polidos, e uma nova versão agora é anunciada com suas novidades.

  ### Mais 98 correções e melhorias de desempenho.

